services:

  postgres:
    image: postgres:15-alpine
    container_name: bountyos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bountyos}
      POSTGRES_USER: ${POSTGRES_USER:-bountyos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bountyos} -d ${POSTGRES_DB:-bountyos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: bountyos-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  server:
    build:
      context: .
      dockerfile: crates/bountyos-server/Dockerfile
    container_name: bountyos-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bountyos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bountyos}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FIRST_RUN: ${FIRST_RUN:-true}
      RUST_LOG: ${RUST_LOG:-info}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      EVIDENCE_BASE_PATH: /app/evidence
      LLM_ENABLED: "false"
    volumes:
      - ./evidence:/app/evidence
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./wordlists:/app/wordlists:ro
      - ./knowledge-base:/app/knowledge-base:ro
    ports:
      # Binds strictly to private interface (127.0.0.1) by default; override in .env for LAN access
      - "${SERVER_BIND_IP:-127.0.0.1}:${SERVER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws}
        BACKEND_URL: ${BACKEND_URL:-http://server:8000}
    container_name: bountyos-frontend
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_URL: http://server:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws}
    ports:
      # Binds strictly to private interface (127.0.0.1) by default; override in .env for LAN access
      - "${FRONTEND_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: bountyos-mcp
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3005
      MCP_TRANSPORT: sse
      BOUNTYOS_API_URL: http://server:8000
      BOUNTYOS_USERNAME: admin
      BOUNTYOS_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin}
    ports:
      # Binds strictly to private interface (127.0.0.1) by default; override in .env for LAN access
      - "${MCP_BIND_IP:-127.0.0.1}:${MCP_PORT:-3005}:3005"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  nginx:
    image: nginx:alpine
    container_name: bountyos-nginx
    restart: unless-stopped
    profiles: ["proxy"]
    depends_on:
      server:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${NGINX_BIND_IP:-127.0.0.1}:${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_BIND_IP:-127.0.0.1}:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./evidence:/var/www/evidence:ro
    deploy:
      resources:
        limits:
          memory: 128M
  lab-target:
    image: node:20-alpine
    container_name: bountyos-lab-target
    restart: unless-stopped
    command: ["node", "/app/app.js"]
    volumes:
      - ./scripts/vulnerable_lab:/app:ro
    ports:
      - "127.0.0.1:8888:8888"
    networks:
      default:
        aliases:
          - target.local
          - app.target.local
          - search.target.local
          - api.target.local

volumes:
  postgres_data:
    name: bountyos_postgres_data
  redis_data:
    name: bountyos_redis_data
