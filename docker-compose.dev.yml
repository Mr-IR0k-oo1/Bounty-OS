version: '3.8'

services:

  postgres:
    extends:
      service: postgres
      file: docker-compose.yml

  redis:
    extends:
      service: redis
      file: docker-compose.yml

  server:
    extends:
      service: server
      file: docker-compose.yml
    environment:
      RUST_LOG: debug
      DATABASE_URL: postgres://bountyos:${DB_PASSWORD}@postgres/bountyos
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FIRST_RUN: ${FIRST_RUN:-true}
    volumes:
      - ./crates/bountyos-server:/app/crates/bountyos-server
      - ./evidence:/app/evidence
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
      - ./logs:/app/logs
    command: cargo watch -x run

  frontend:
    extends:
      service: frontend
      file: docker-compose.yml
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  nginx:
    extends:
      service: nginx
      file: docker-compose.yml
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./evidence:/var/www/evidence:ro

volumes:
  postgres_data:
  redis_data:
