[package]
name = "bountyos-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonwebtoken = "9.2"
argon2 = "0.5"
totp-rs = { version = "5.0", features = ["gen_secret", "otpauth"] }
redis = { version = "0.24", features = ["tokio-comp"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "uuid", "json", "chrono", "migrate"] }
reqwest = { version = "0.11", features = ["json"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tower_governor = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = "0.13"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
futures-util = "0.3"
base32 = "0.5"
sha2 = "0.10"
hex = "0.4"
governor = "0.6"
roxmltree = "0.19"

[dependencies.bountyos-common]
path = "../bountyos-common"

[dependencies.bountyos-analyzer]
path = "../bountyos-analyzer"

[dev-dependencies]
tokio-test = "0.4"
