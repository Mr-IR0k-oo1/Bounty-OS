[package]
name = "bountyos-common"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
description = "Common data structures and types for Bounty OS"
repository = "https://github.com/Mr-IR0k-oo1/Bounty-OS"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.0", features = ["sync", "rt"] }
async-trait = "0.1"


