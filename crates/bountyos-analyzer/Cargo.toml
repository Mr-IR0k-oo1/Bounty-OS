[package]
name = "bountyos-analyzer"
version = "0.1.0"
edition = "2021"
default-run = "bountyos-analyzer"

[dependencies]
bountyos-common = { path = "../bountyos-common" }
anyhow = "1.0"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tracing = "0.1"

[[bin]]
name = "bountyos-analyzer"
path = "src/main.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
